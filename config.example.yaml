# Rack Power Monitor configuration — copy to config.yaml and edit for your environment.

poll_interval_seconds: 60
alert_cooldown_minutes: 15

snmp:
  version: "2c"
  timeout_seconds: 5
  retries: 2
  # APC rPDU2 MIB — tabular OIDs need the row index (.1). Power is in hundredths of kW.
  power_oid: "1.3.6.1.4.1.318.1.1.26.4.3.1.5.1"
  power_divisor: 100
  energy_oid: "1.3.6.1.4.1.318.1.1.26.4.3.1.9.1"
  energy_divisor: 10

racks:
  - name: "Rack A"
    description: "Row 1 · Slots 1-2"
    warning_kw: 2.5
    critical_kw: 3.0
    pdus:
      - name: "PDU A1"
        host: "10.0.1.11"
        community: "public"
      - name: "PDU A2"
        host: "10.0.1.12"
        community: "public"

  - name: "Rack B"
    description: "Row 1 · Slots 3-4"
    warning_kw: 2.5
    critical_kw: 3.0
    pdus:
      - name: "PDU B1"
        host: "10.0.1.13"
        community: "public"
      - name: "PDU B2"
        host: "10.0.1.14"
        community: "public"

smtp:
  host: "smtp.company.com"
  port: 587
  security: "tls"  # none | tls | ssl
  username: "alerts@company.com"
  password: "changeme"
  from_address: "pdu-monitor@company.com"
  recipients:
    - "ops-team@company.com"
    - "john.smith@company.com"

webhooks:
  - name: "Ops Slack"
    url: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
    format: "slack"  # generic | slack | discord
    enabled: true
  - name: "Discord"
    url: "https://discord.com/api/webhooks/ID/TOKEN"
    format: "discord"
    enabled: false

server:
  host: "0.0.0.0"
  port: 8080
  config_path: "config.yaml"
