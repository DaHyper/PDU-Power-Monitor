# Rack Power Monitor configuration — copy to config.yaml and edit for your environment.

poll_interval_seconds: 60
alert_cooldown_minutes: 15

snmp:
  version: "2c"
  timeout_seconds: 5
  retries: 2
  # APC rPDU2 MIB — verify with: snmpwalk -v2c -c public <ip> 1.3.6.1.4.1.318.1.1.26.4.3.1.5
  power_oid: "1.3.6.1.4.1.318.1.1.26.4.3.1.5"
  # Divide raw SNMP integer by this to get kW — verify with snmpwalk (see README)
  power_divisor: 1000
  energy_oid: "1.3.6.1.4.1.318.1.1.26.4.3.1.9"
  energy_divisor: 10

racks:
  - name: "Rack A"
    location: "Row 1 · Slots 1-2"
    warning_kw: 2.5
    critical_kw: 3.0
    pdus:
      - name: "PDU A1"
        host: "10.0.1.11"
        community: "public"
      - name: "PDU A2"
        host: "10.0.1.12"
        community: "public"

  - name: "Rack B"
    location: "Row 1 · Slots 3-4"
    warning_kw: 2.5
    critical_kw: 3.0
    pdus:
      - name: "PDU B1"
        host: "10.0.1.13"
        community: "public"
      - name: "PDU B2"
        host: "10.0.1.14"
        community: "public"

smtp:
  host: "smtp.company.com"
  port: 587
  security: "tls"  # none | tls | ssl
  username: "alerts@company.com"
  password: "changeme"
  from_address: "pdu-monitor@company.com"
  recipients:
    - "ops-team@company.com"
    - "john.smith@company.com"

server:
  host: "0.0.0.0"
  port: 8080
  config_path: "config.yaml"
